# Auto-merge ready cursor/* PRs after Vercel succeeds so production deploys without manual merges.
name: Auto-ship cursor PRs to production

on:
  check_suite:
    types: [completed]
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: auto-ship-${{ github.event.pull_request.number || github.event.check_suite.head_sha }}
  cancel-in-progress: false

jobs:
  merge-when-green:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Resolve eligible PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const sha =
              context.payload.check_suite?.head_sha ??
              context.payload.pull_request?.head?.sha;

            if (!sha) {
              core.setOutput("found", "false");
              return;
            }

            let pr = context.payload.pull_request ?? null;
            if (!pr) {
              const { data: openPrs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100,
              });
              pr = openPrs.find((candidate) => candidate.head.sha === sha) ?? null;
            }

            if (!pr) {
              core.info(`No open PR for commit ${sha}`);
              core.setOutput("found", "false");
              return;
            }

            if (pr.draft) {
              core.info(`PR #${pr.number} is draft — skipping auto-merge`);
              core.setOutput("found", "false");
              return;
            }

            if (pr.base.ref !== "main") {
              core.info(`PR #${pr.number} targets ${pr.base.ref}, not main — skipping`);
              core.setOutput("found", "false");
              return;
            }

            if (!pr.head.ref.startsWith("cursor/")) {
              core.info(`PR #${pr.number} branch ${pr.head.ref} is not cursor/* — skipping`);
              core.setOutput("found", "false");
              return;
            }

            core.setOutput("found", "true");
            core.setOutput("number", String(pr.number));
            core.setOutput("head_sha", pr.head.sha);

      - name: Wait for Vercel check on PR head
        if: steps.pr.outputs.found == 'true'
        id: vercel
        uses: actions/github-script@v7
        with:
          script: |
            const sha = "${{ steps.pr.outputs.head_sha }}";
            const maxAttempts = 30;

            for (let i = 0; i < maxAttempts; i++) {
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
              });

              const vercel = combined.statuses.find((s) => s.context === "Vercel");
              if (vercel?.state === "success") {
                core.setOutput("ready", "true");
                core.info(`Vercel succeeded: ${vercel.target_url}`);
                return;
              }
              if (vercel?.state === "failure" || vercel?.state === "error") {
                core.setFailed(`Vercel check failed: ${vercel.description}`);
                return;
              }

              core.info(`Waiting for Vercel (${i + 1}/${maxAttempts})…`);
              await new Promise((r) => setTimeout(r, 10000));
            }

            core.setFailed("Timed out waiting for Vercel check");

      - name: Merge PR to main (triggers production deploy)
        if: steps.pr.outputs.found == 'true' && steps.vercel.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const number = Number("${{ steps.pr.outputs.number }}");
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });

            if (pr.merged || pr.state !== "open") {
              core.info(`PR #${number} already closed/merged`);
              return;
            }

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
              merge_method: "merge",
            });

            core.notice(`Merged PR #${number} — Vercel production deploy should start on main.`);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: [
                "**Auto-shipped to production**",
                "",
                "This `cursor/*` PR passed the Vercel check and was merged to `main`.",
                "Production deploys from `main` only. Check the Vercel dashboard for the live deployment.",
                "",
                "See `docs/deployments.md` for preview vs production details.",
              ].join("\n"),
            });
